# Configuration for cargo-about, which generates THIRD-PARTY-NOTICES.html in
# the release workflow (see .github/workflows/release.yml). The accepted list
# is priority-ordered: dual-licensed crates resolve to the first matching entry.
accepted = [
    "MIT",
    "Apache-2.0",
    "Unlicense",
    "Unicode-3.0",
]

# Only what actually ships: prune the graph to the release target.
targets = ["x86_64-pc-windows-msvc"]

# winres runs at build time and ships nothing, but listing build deps costs
# little and errs on the side of complete attribution.
ignore-build-dependencies = false
ignore-dev-dependencies = true

# This crate itself (publish = false) is not a third party.
private = { ignore = true }

# Microsoft ships the MIT text as `license-mit` (lowercase, no extension), which
# cargo-about's automatic discovery does not pick up — it silently falls back to
# the canonical SPDX template, whose "Copyright (c) <year> <copyright holders>"
# placeholder would replace the real attribution in the generated notices. These
# clarifications point it at the actual file. The checksum is of the file
# content, which is byte-identical across every windows-* crate and unchanged
# since at least the 0.52 generation, so version bumps do not invalidate it.
# Regenerate with: cargo about clarify license-mit path <crate-source-dir>

[windows.clarify]
license = "MIT"

[[windows.clarify.files]]
path = "license-mit"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"
license = "MIT"

