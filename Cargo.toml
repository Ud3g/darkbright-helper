[package]
name = "darkbright-helper"
version = "0.8.0"
edition = "2024"
rust-version = "1.87"
# Internal pub surface, distributed via GitHub releases — never crates.io.
publish = false

[dependencies]
# Windows API. Deliberately pinned at 0.52 for stability — an upgrade
# touches nearly every FFI call site and is treated as its own undertaking
# (see docs/improvement-ideas.md, Maintenance section), not allowed to drift.
# Re-evaluate the pin at the next MSRV bump, at latest 2027-07; upgrading
# earlier is always fine — the trigger bounds the decision, it is not a gate.
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Devices_Display",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_Security",
] }

# Error handling
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging. The kv feature (structured key-value fields) is stable in the
# log crate since 0.4.21.
log = { version = "0.4", features = ["kv"] }
# unstable-kv renders the structured key-value pairs (console and file);
# without it env_logger silently drops them. Still marked unstable upstream —
# no stable alternative exists yet; watch for a rename on a future major bump.
env_logger = { version = "0.11", features = ["unstable-kv"] }

# Linter Configuration (from code-conventions.md)
[lints.clippy]
all = "warn"
pedantic = "warn"

[build-dependencies]
winres = "0.1"
