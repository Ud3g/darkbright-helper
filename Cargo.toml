[package]
name = "darkbright-helper"
version = "0.7.1"
edition = "2024"
rust-version = "1.85"

[dependencies]
# Windows API
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Devices_Display",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
] }

# Error handling
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = { version = "0.4", features = ["kv_unstable"] }
env_logger = "0.11"

# Synchronization
parking_lot = "0.12"

# Directory paths
dirs-next = "2.0"

# Linter Configuration (from code-conventions.md)
[lints.clippy]
all = "warn"
pedantic = "warn"

[build-dependencies]
winres = "0.1"
