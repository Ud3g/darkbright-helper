[package]
name = "darkbright-helper"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
description = "Hotkey-driven monitor brightness control for Windows via DDC/CI, with an overlay fallback for dimming below the hardware minimum."
repository = "https://github.com/Ud3g/darkbright-helper"
license = "MIT OR Apache-2.0"
# Internal pub surface, distributed via GitHub releases — never crates.io.
publish = false

[dependencies]
# Windows API. Tracks the current minor; patch releases may drift freely.
# Minor/major bumps change FFI signatures across src/platform/windows/ and
# remain deliberate standalone undertakings with a full manual hardware test
# pass (DDC, OSD, overlay, tray, hotkeys, power events) — never a side effect
# of another change.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Devices_Display",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_Security",
] }

# Error handling
thiserror = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging. The kv feature (structured key-value fields) is stable in the
# log crate since 0.4.21.
log = { version = "0.4", features = ["kv"] }
# unstable-kv renders the structured key-value pairs (console and file);
# without it env_logger silently drops them. Still marked unstable upstream —
# no stable alternative exists yet; watch for a rename on a future major bump.
env_logger = { version = "0.11", features = ["unstable-kv"] }

# Linter Configuration (from code-conventions.md)
[lints.clippy]
all = "warn"
pedantic = "warn"

[build-dependencies]
winres = "0.1"
