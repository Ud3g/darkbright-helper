[package]
name = "darkbright-helper"
version = "0.13.0"
edition = "2024"
rust-version = "1.88"
description = "Hotkey-driven monitor brightness control for Windows via DDC/CI, with an overlay fallback for dimming below the hardware minimum."
repository = "https://github.com/Ud3g/darkbright-helper"
license = "MIT OR Apache-2.0"
# Internal pub surface, distributed via GitHub releases — never crates.io.
publish = false

[dependencies]
# Windows API. Tracks the current minor; patch releases may drift freely.
# Minor/major bumps change FFI signatures across src/platform/windows/ and
# remain deliberate standalone undertakings with a full manual hardware test
# pass (DDC, OSD, overlay, tray, hotkeys, power events) — never a side effect
# of another change.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Devices_Display",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Globalization",
] }

# Error handling
thiserror = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging. The kv feature (structured key-value fields) is stable in the
# log crate since 0.4.21.
log = { version = "0.4", features = ["kv"] }
# Default features are off to leave out `regex`: it only turns the message
# filter in `RUST_LOG=<level>/<filter>` from a substring match into a regular
# expression, and links four crates (about 1 MB) for it. Cargo.lock still lists
# them — Cargo locks optional dependencies whether enabled or not — so
# `cargo audit` and Dependabot keep reporting on them.
# The remaining features are opt-in as a result, and none of them fails the
# build when removed; its output just disappears: auto-color (console colours),
# humantime (every timestamp, console and file), unstable-kv (the structured
# key-value fields; still marked unstable upstream — no stable alternative
# exists yet, watch for a rename on a future major bump).
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime", "unstable-kv"] }

# Linter Configuration (from code-conventions.md)
[lints.rust]
# Edition 2024 only warns; deny it so a plain `cargo build` fails too. Every
# unsafe operation must name its own `unsafe { }` block, so that an `unsafe fn`
# signature does not silently bless the whole body.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[build-dependencies]
winres = "0.1"

# Size over speed. The app has almost no CPU-bound code of its own — GDI draws
# the OSD, a DDC write blocks for 40–120 ms in the hardware — so Cargo's
# speed-oriented defaults spend executable size on speed nobody can observe.
# The measurements are in docs/architecture.md, "Release profile: size over
# speed".
[profile.release]
# "z" rather than "s": it gives up loop vectorisation and most inlining for a
# still smaller executable, and neither was measurably slower than Cargo's
# default on any latency a user can feel. Re-measure before adding CPU-bound
# code of the app's own; "s" is the fallback.
opt-level = "z"
# Whole-program optimisation in a single unit: unused and duplicated code is
# dropped across crate boundaries, which thin LTO and the default 16 units
# leave in.
lto = "fat"
codegen-units = 1
# `panic` deliberately stays at its default, "unwind". "abort" would shrink the
# executable further, but a panicking worker thread has to unwind for its
# death to be noticed and the thread respawned — see the panic policy under
# "Worker Supervision & State Watchdog" in docs/architecture.md.
